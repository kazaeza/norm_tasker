# Настройки бота. Скопируйте этот файл в data/config.yaml и заполните.
# Файл с настоящими именами и идентификаторами хранится только на сервере: в репозиторий
# он не попадает (config.yaml в .gitignore).
#
# Время пишите в кавычках: "09:30". Без кавычек YAML читает 9:30 как число.

timezone: Europe/Moscow            # по этому поясу считаются все сроки
designer_timezone: Asia/Yekaterinburg  # справочно: у дизайнера на 2 часа больше, чем в Москве

# Рабочий чат. Узнать номер: добавьте бота в чат и отправьте /id.
chat_id: -1001234567890
# Если в группе включены темы и бот должен писать в одну из них, отправьте /id в этой теме
# и впишите thread_id:
# thread_id: 12

# Команда. username — без @. Роли:
#   copywriter  — берёт посты и пишет тексты; бот тегает его при подходе срока;
#   responsible — ответственный за проект: дизайн, показ клиенту, финальный ок КП, эскалации;
#   boss        — руководитель: бот его не тегает и не реагирует на его сообщения.
team:
  - name: Имя Первого Копирайтера
    username: first_copywriter
    role: copywriter
  - name: Имя Второго Копирайтера
    username: second_copywriter
    role: copywriter
  - name: Имя Ответственного
    username: responsible_person
    role: responsible
  - name: Имя Руководителя
    username: boss_person
    role: boss

# Кем считать участника чата, которого нет в списке выше: copywriter или null (не замечать).
unknown_role: copywriter

# Как в чате зовут людей клиента: по этим именам бот понимает «отправил Алисе текст» как
# «текст показан клиенту». Слова «клиент» и «заказчик» понимаются и без списка.
client_names:
  - Имя Человека Клиента

# Имена авторов комментариев так, как их показывает Google в КП и доках.
# Автор, которого нет в team_authors, считается клиентом — о его комментариях бот сообщает.
client_authors:
  - Имя Клиента из Google
team_authors:
  - Имя Копирайтера из Google
  - Имя Ответственного из Google

# --- Всё ниже необязательно: указаны значения по умолчанию ---------------------------------

# Первые дни бот только пишет утреннее саммари и ведёт доску, без напоминаний и эскалаций.
soft_start_days: 14

# Писать ли напоминания в выходные и праздники.
weekend_reminders: false

# Дополнительные нерабочие и рабочие дни поверх производственного календаря РФ.
extra_days_off: []       # например: [2026-12-31]
extra_workdays: []

# Если статусы в выпадающем списке КП поменяются, сопоставьте их этапам:
# TAKEN, TEXT_SHOWN, TEXT_OK, AT_DESIGNER, DESIGN_READY, SHOWN_DESIGN, FINAL_OK, PUBLISHED.
# Стандартное соответствие: «В работе» — TAKEN, «Текст на согласовании» — TEXT_SHOWN,
# «Текст готов» — TEXT_OK, «Дизайн на согласовании» — SHOWN_DESIGN, «Готово» — FINAL_OK,
# «Выпущено» — PUBLISHED.
kp_statuses: {}
#  "Согласовано клиентом": TEXT_OK

# Сроки поста. D — дата выхода, D−1 и D−2 — рабочие дни до неё.
deadlines:
  take_days_before: 4        # пост должен быть взят
  text_days_before: 2        # текст готов и показан клиенту (правило команды)
  show_days_before: 1        # готовый пост с дизайном показан клиенту (правило команды)
  day_end: "18:00"           # конец рабочего дня
  text_ok_warn: "11:00"      # D−1: ока по тексту нет — пора напомнить клиенту
  text_ok_hard: "13:00"      # D−1: позже дизайн не успевает
  handoff_from: "09:00"      # D−1: окно, когда лучше передать пост дизайнеру
  handoff_to: "10:00"
  handoff_hard: "13:00"      # D−1: крайний срок передачи дизайнеру
  final_ok_check: "12:00"    # день выхода: проверка финального ока и публикации

# Когда бот напоминает (по Москве); на каждое время — одно сообщение со всеми постами.
schedule:
  summary: "09:30"           # утреннее саммари в рабочие дни
  take_reminder: "16:00"     # D−4: пост никто не взял
  text_reminder: "12:00"     # D−2: сегодня текст должен быть готов и показан клиенту
  text_overdue: "18:00"      # D−2: просрочка
  ok_nudge: "11:00"          # D−1: ока по тексту нет
  handoff_deadline: "13:00"  # D−1: не передано дизайнеру
  show_reminder: "16:00"     # D−1: пост ещё не показан клиенту
  show_overdue: "18:00"      # D−1: просрочка
  final_reminder: "12:00"    # день выхода: нет финального ока или поста нет в отложенных
  weekly_report: "17:00"     # пятничный отчёт
  kp_reminder: "12:00"       # КП: напоминание об оке и о показе
  kp_overdue: "18:00"        # КП: просрочка

# КП на следующий месяц.
kp:
  show_day: 25                    # показываем клиенту 25-го; выходной — в ближайший рабочий день
  start_workdays_before_show: 4   # старт сборки
  ok_workdays_before_show: 1      # финальный ок ответственного — до конца этого дня до показа
