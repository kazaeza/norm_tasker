name: CI

on:
  push:
  pull_request:
  workflow_dispatch:  # кнопка «Run workflow» на вкладке Actions: повторить проверки и доставку

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать образ
        run: docker build -t norm-tasker .
      - name: Образ запускается и видит встроенный календарь
        run: |
          docker run --rm norm-tasker python -m norm_tasker --help
          docker run --rm norm-tasker python -c "from norm_tasker.calendar_ru import load_bundled; print(sorted(load_bundled()))"
      - name: Пример настроек читается внутри образа
        run: |
          docker run --rm -v "$PWD/config.example.yaml:/data/config.yaml:ro" norm-tasker \
            python -c "from pathlib import Path; from norm_tasker.config import load_settings; print(load_settings(Path('/data/config.yaml')).deadlines)"
      - name: Compose-файл корректен
        run: |
          cp .env.example .env
          docker compose config --quiet

  # Доставка в Amvera. Вебхуки Amvera для GitHub у нас не срабатывали, поэтому после успешных
  # проверок код отправляется прямо в git-репозиторий проекта на Amvera: она собирает образ
  # при каждом пуше в его ветку master. Секреты (Settings → Secrets and variables → Actions):
  # AMVERA_GIT_URL (адрес репозитория проекта), AMVERA_USER и AMVERA_PASSWORD (вход в Amvera).
  # Пока их нет, шаг ничего не делает.
  deploy:
    needs: [test, docker]
    if: >-
      github.event_name != 'pull_request'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency:
      group: amvera-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # полная история: из неполной копии Amvera код не примет
      - name: Отправить код в Amvera
        env:
          AMVERA_GIT_URL: ${{ secrets.AMVERA_GIT_URL }}
          AMVERA_USER: ${{ secrets.AMVERA_USER }}
          AMVERA_PASSWORD: ${{ secrets.AMVERA_PASSWORD }}
        run: |
          if [ -z "$AMVERA_GIT_URL" ] || [ -z "$AMVERA_USER" ] || [ -z "$AMVERA_PASSWORD" ]; then
            echo "Секреты AMVERA_GIT_URL, AMVERA_USER, AMVERA_PASSWORD не заданы: код в Amvera не отправляется."
            exit 0
          fi
          auth=$(printf '%s:%s' "$AMVERA_USER" "$AMVERA_PASSWORD" | base64 -w0)
          echo "::add-mask::$auth"
          if ! git -c "http.extraheader=Authorization: Basic $auth" push --force "$AMVERA_GIT_URL" HEAD:master; then
            echo "::error::Amvera не приняла код. Проверьте секреты AMVERA_GIT_URL, AMVERA_USER и AMVERA_PASSWORD."
            exit 1
          fi
